<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口罩</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/color_font.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        .list-group-item {
            position: relative;
        }

        .mask-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            border-radius: 20px;
            padding: 6px 10px;
            font-size: 1rem;
            font-weight: 900;
            color: white;
        }

        .bg01 {
            background-color: rgb(255, 255, 255);
            border-left: 6px solid #16b95a;
        }

        .bg02 {
            background-color: rgb(255, 255, 255);
            border-left: 6px solid #c40b0b;
        }

        #myMask {
            overflow-y: scroll;
            height: 80vh;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <div class="col-md-3 ">
                <select name="" id="cityOption" class="form-select form-select-lg mt-3">
                    <option value="" selected disabled>----請選擇縣市----</option>
                    <option value="台北市">台北市</option>
                    <option value="台中市">台中市</option>
                </select>

                <select name="" id="areaOption" class="form-select form-select-lg mt-3" disabled>
                    <option value="" selected disabled>----請選擇鄉鎮----</option>
                    <option value="西屯區">西屯區</option>
                    <option value="北屯區">北屯區</option>
                </select>

                <ul class="list-group mt-3" id="myMask">
                    <li class="list-group-item">
                        <span class="mask-badge bg-success">足夠</span>
                        <div class="h4 fw-900">名稱:xxx</div>
                        <div class="h4 fw-900">地址:xxx</div>
                        <div class="h4 fw-900">電話:xxx</div>
                        <div class="h4 fw-900">成人口罩:xxx</div>
                        <div class="h4 fw-900">兒童口罩:xxx</div>
                    </li>
                </ul>
            </div>
            <div class="col-md-9">
                <div id="map" class="vh-100 p-0"></div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/jquery-3.7.1.js"></script>
    <script>
        // $.ajax({
        //     type:"GET",
        //     url:"js/CityCountyData.json",
        //     dataType:"json",
        //     success:function(data){
        //         console.log(data);
        //     },
        //     error:function(){
        //         console.log("error");
        //     }
        // })
        // await 需要等這個fuction拿到資料才會執行
        // async 
        let cityData;
        let maskData;
        let selectedCity;
        let selectedArea;
        let map;
        $(async function () {
            // $('#myMask').empty();
            // 讀取縣市資料
            cityData = await getCityData();
            areaData = await getCityData();

            // 讀取健保局資料
            maskData = await getMaskData();
            console.log(maskData);

            // 產生縣市
            renderCityOption(cityData);

            // 產生地圖
            drawMap();
            var blackIcon = new L.Icon({
                iconUrl: 'img/marker.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            // 監聽縣市
            $('#cityOption').on("change", function () {
                $("#areaOption").prop("disabled", false);
                console.log($(this).val());
                selectedCity = $(this).val();
                cityData.forEach(function (item) {
                    if (item.CityName == selectedCity) {
                        renderAreaOption(item.AreaList);
                    }
                });

            });

            $('#areaOption').on("change", function () {
                console.log($(this).val());
                selectedArea = $(this).val();
                $('#myMask').empty();
                removeMarker();
                markerMap = {};
                let count = 0; //統計該區藥局數量 
                let flag_panTo = false;
                maskData.features
                    .forEach(function (item) {
                        if (item.properties.county == selectedCity && item.properties.town == selectedArea) {
                            count++;
                            if(!flag_panTo){
                                map.panTo([item.geometry.coordinates[1],item.geometry.coordinates[0]]);
                                flag_panTo = !flag_panTo;
                            }
                            

                            const badgeText = item.properties.mask_adult < 1000 ? "缺少" : "足夠";
                            const badgeClass = badgeText === "足夠" ? "bg-success" : "bg-danger";
                            const bg = badgeText === "足夠" ? "bg01" : "bg02";

                            const key = item.properties.id;
                            let strHTML = `
                            <li class="list-group-item ${bg}" data-key="${key}">
                                <span class="mask-badge ${badgeClass}">${badgeText}</span>
                                <div class="h4 fw-900">名稱:${item.properties.name}</div>
                                <div class="h4 fw-900">地址:${item.properties.address}</div>
                                <div class="h4 fw-900">電話:${item.properties.phone}</div>
                                <div class="h4 fw-900">成人口罩:${item.properties.mask_adult}</div>
                                <div class="h4 fw-900">兒童口罩:${item.properties.mask_child}</div>
                            </li>
                        `;
                            $('#myMask').append(strHTML);

                            // 劃出marker
                            const marker =
                            L.marker([item.geometry.coordinates[1], item.geometry.coordinates[0]], { icon: blackIcon }).addTo(map)
                                .bindPopup(`<div class="card shadow-sm" style="width: 220px;">
                                <div class="h4 fw-900">名稱:${item.properties.name}</div>
                                <div class="h4 fw-900">地址:${item.properties.address}</div>
                                <div class="h4 fw-900">電話:${item.properties.phone}</div>
                                <div class="h4 fw-900">成人口罩:${item.properties.mask_adult}</div>
                                <div class="h4 fw-900">兒童口罩:${item.properties.mask_child}</div>
                            </div>`);
                            markerMap[key] = marker;
                        }
                    });
                if (count == 0) {
                    $('#myMask').append(`<li class="list-group-item h1 text-muted">該區域沒有藥局資料 </li>`);
                }

            });
        });

        // 監聽myList
        $('#myMask').on("click", ".list-group-item", function () {
            const key = $(this).data("key");
            console.log(key);
            const marker = markerMap[key];
            if (marker) {
                map.panTo(marker.getLatLng()); // getLatLng() 經度緯度
                marker.openPopup(); // openPopup() 彈出來
            }else{
                return;
            }

            // 標註目前所選的藥局
            $('#myMask .list-group-item').removeClass('active');
            $(this).addClass('active');
        });

        function drawMap() {
            map = L.map('map').setView([24.1705315, 120.5998206], 13);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
        }

        async function getCityData() {
            const res = await axios.get('./js/CityCountyData.json');
            return res.data;
        }

        // 讀取健保局資料
        async function getMaskData() {
            const res = await axios.get('./js/points.json');
            return res.data;
        }

        function renderCityOption(cityData) {
            $('#cityOption').empty();
            $('#cityOption').append(`<option value="" selected disabled>----請選擇縣市----</option>`);
            cityData.forEach(function (item) {
                let strHTML = `
                <option value="${item.CityName}">${item.CityName}</option>
                `;
                $('#cityOption').append(strHTML);
            });
        }

        function renderAreaOption(AreaList) {
            $('#areaOption').empty();
            $('#areaOption').append(`<option value="" selected disabled>----請選擇鄉鎮----</option>`);
            AreaList.forEach(function (area) {
                let strHTML = `
                <option value="${area.AreaName}">${area.AreaName}</option>
                `;
                $('#areaOption').append(strHTML);
            })
        }

        // 清除markers
        function removeMarker() {
            map.eachLayer(function (layer) {
                if(layer instanceof L.Marker){
                    map.removeLayer(layer);
                }
            });
        }
    </script>
</body>

</html>
